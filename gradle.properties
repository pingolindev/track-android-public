# Project-wide Gradle settings
# Heap sized for a large build host: R8 minification + KSP are the
# heap-hungry steps (4G here, plus 3G for the Kotlin daemon).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m

# Hilt/KSP do not support AGP 9's new DSL and built-in Kotlin, so both stay
# off, accepting AGP's deprecation warnings (these switches go away in AGP
# 10.0).
android.builtInKotlin=false
android.newDsl=false

# Reuse the configured task graph between invocations.
#
# A build run with --no-daemon (where a daemon-side error message would
# replace the real one) configures the whole project from cold on every
# invocation; the configuration cache keeps that work across invocations
# instead.
#
# The saving is small (about 3 s per invocation), but it is a fixed cost
# paid on every invocation, it costs nothing to keep, and it grows with the
# project rather than shrinking. The Android Gradle Plugin, KSP and Hilt all
# store an entry with no problems.
org.gradle.configuration-cache=true
